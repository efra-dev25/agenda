<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda de Audiencias - JG Illapel</title>

  <!-- FullCalendar v6 -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales/es.global.min.js"></script>

  <!-- SheetJS para lectura de Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- jsPDF + AutoTable para exportación directa a PDF 8.5 x 13" (Oficio) -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

  <!-- Firebase Compat SDK v10 -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --gcal-bg: #131314;
      --gcal-surface: #1e1f20;
      --gcal-surface-hover: #282a2c;
      --gcal-surface-active: #333537;
      --gcal-border: #3c4043;
      --gcal-grid-line: #2c2d30;
      --gcal-text: #e3e3e3;
      --gcal-text-muted: #9aa0a6;
      --gcal-accent: #8ab4f8;
      --gcal-accent-solid: #1a73e8;
      --gcal-accent-text: #062e6f;
    }

    * { box-sizing: border-box; font-family: 'Google Sans', 'Segoe UI', Roboto, system-ui, sans-serif; }
    body { margin: 0; background: var(--gcal-bg); color: var(--gcal-text); overflow: hidden; }

    /* =====================================================================
       1. PANTALLA LOGIN
    ===================================================================== */
    #login-screen {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; background: var(--gcal-bg);
    }
    .login-box {
      background: var(--gcal-surface); padding: 2rem; border-radius: 16px;
      width: 100%; max-width: 390px; border: 1px solid var(--gcal-border);
      box-shadow: 0 12px 32px rgba(0,0,0,0.55);
    }
    .login-box h2 { margin-top: 0; color: var(--gcal-text); font-size: 1.3rem; font-weight: 500; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 500; margin-bottom: 0.35rem; color: var(--gcal-text-muted); }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 0.58rem 0.7rem; border: 1px solid var(--gcal-border);
      border-radius: 8px; font-size: 0.9rem; background: #131314; color: var(--gcal-text);
    }
    .form-group input:focus, .form-group select:focus {
      outline: none; border-color: var(--gcal-accent);
    }

    /* Botones generales */
    .btn {
      padding: 0.5rem 0.9rem; border: none; border-radius: 20px; cursor: pointer;
      font-weight: 500; font-size: 0.83rem; transition: background 0.18s, opacity 0.18s;
      display: inline-flex; align-items: center; gap: 0.35rem; color: var(--gcal-text);
      background: var(--gcal-surface-hover);
    }
    .btn:hover { background: var(--gcal-surface-active); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: var(--gcal-accent-solid); color: #fff; }
    .btn-primary:hover { background: #1b66c9; }
    .btn-success { background: #137333; color: #fff; }
    .btn-success:hover { background: #188038; }
    .btn-warning { background: #b06000; color: #fff; }
    .btn-warning:hover { background: #c26a00; }
    .btn-danger { background: #c5221f; color: #fff; }
    .btn-danger:hover { background: #d93025; }
    .btn-info { background: #00639b; color: #fff; }
    .btn-info:hover { background: #0077b6; }
    .btn-purple { background: #681da8; color: #fff; }
    .btn-purple:hover { background: #7b1fa2; }
    .btn-outline { background: transparent; border: 1px solid var(--gcal-border); color: var(--gcal-text); }
    .btn-outline:hover { background: var(--gcal-surface-hover); }

    /* =====================================================================
       2. ESTRUCTURA PRINCIPAL ESTILO GOOGLE CALENDAR
    ===================================================================== */
    #app-screen {
      display: none;
      flex-direction: column;
      height: 100vh;
      background: var(--gcal-bg);
    }

    /* Barra Superior (Topbar Google Calendar) */
    .gcal-topbar {
      height: 64px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--gcal-bg);
      border-bottom: 1px solid transparent;
      flex-shrink: 0;
    }

    .gcal-top-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 240px;
    }

    .icon-circle-btn {
      width: 40px; height: 40px; border-radius: 50%; border: none;
      background: transparent; color: var(--gcal-text); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.15rem; transition: background 0.15s;
    }
    .icon-circle-btn:hover { background: var(--gcal-surface-hover); }

    .gcal-brand {
      display: flex; align-items: center; gap: 10px; user-select: none;
    }
    .gcal-logo-box {
      width: 36px; height: 36px; border-radius: 8px; background: #1a73e8;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      position: relative; overflow: hidden;
    }
    .gcal-logo-box::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 8px; background: #174ea6;
    }
    .gcal-logo-day {
      font-size: 0.95rem; margin-top: 5px; line-height: 1;
    }
    .gcal-brand-title {
      font-size: 1.22rem; font-weight: 400; color: var(--gcal-text); letter-spacing: -0.2px;
      white-space: nowrap;
    }
    .gcal-brand-sub {
      font-size: 0.72rem; color: var(--gcal-text-muted); display: block; line-height: 1.1;
    }

    /* Centro de Topbar: Hoy, < >, Fecha actual y Semana N */
    .gcal-top-center {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .gcal-pill-btn {
      height: 36px;
      padding: 0 18px;
      border-radius: 18px;
      border: 1px solid var(--gcal-border);
      background: transparent;
      color: var(--gcal-text);
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .gcal-pill-btn:hover { background: var(--gcal-surface-hover); }

    .gcal-nav-arrows {
      display: flex; align-items: center; gap: 2px;
    }
    .gcal-nav-arrows button {
      width: 32px; height: 32px; border-radius: 50%; border: none;
      background: transparent; color: var(--gcal-text); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; font-size: 1rem;
    }
    .gcal-nav-arrows button:hover { background: var(--gcal-surface-hover); }

    .gcal-current-title {
      font-size: 1.32rem;
      font-weight: 400;
      color: var(--gcal-text);
      margin: 0 4px;
      white-space: nowrap;
      text-transform: capitalize;
    }

    .gcal-week-chip {
      background: var(--gcal-surface-hover);
      color: var(--gcal-text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 6px;
      white-space: nowrap;
    }

    /* Derecha de Topbar: Herramientas, Dropdown de Vistas y Usuario */
    .gcal-top-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Dropdown unificado de Vistas (Día / Semana laboral / Semana / Mes) */
    .view-dropdown-wrap {
      position: relative;
    }
    .view-dropdown-trigger {
      height: 36px;
      padding: 0 14px 0 16px;
      border-radius: 18px;
      border: 1px solid var(--gcal-border);
      background: transparent;
      color: var(--gcal-text);
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: background 0.15s;
    }
    .view-dropdown-trigger:hover { background: var(--gcal-surface-hover); }

    .view-dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 42px;
      width: 215px;
      background: #282a2c;
      border: 1px solid var(--gcal-border);
      border-radius: 10px;
      padding: 6px 0;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      z-index: 2000;
    }
    .view-dropdown-menu.open { display: block; }

    .view-option {
      width: 100%;
      padding: 9px 16px;
      border: none;
      background: transparent;
      color: var(--gcal-text);
      font-size: 0.86rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      text-align: left;
    }
    .view-option:hover { background: #37393b; }
    .view-option.active {
      background: rgba(138, 180, 248, 0.16);
      color: var(--gcal-accent);
      font-weight: 600;
    }
    .view-shortcut {
      font-size: 0.74rem;
      color: var(--gcal-text-muted);
      font-family: monospace;
    }

    .user-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--gcal-surface); border: 1px solid var(--gcal-border);
      padding: 4px 10px; border-radius: 18px; font-size: 0.78rem; color: var(--gcal-text);
    }
    .admin-pill {
      background: #7c3aed; color: #fff; font-size: 0.65rem; font-weight: 700;
      padding: 1px 6px; border-radius: 10px; text-transform: uppercase;
    }

    /* =====================================================================
       3. CUERPO PRINCIPAL: SIDEBAR IZQUIERDO + ÁREA CALENDARIO
    ===================================================================== */
    .gcal-workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
      padding: 0 12px 12px 0;
    }

    /* Sidebar Izquierdo (256px) */
    .gcal-sidebar {
      width: 256px;
      flex-shrink: 0;
      padding: 4px 14px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      transition: width 0.2s, padding 0.2s, opacity 0.2s;
    }
    .gcal-sidebar.collapsed {
      width: 0;
      padding: 0;
      opacity: 0;
      overflow: hidden;
    }

    /* Botón "+ Crear" estilo FAB redondeado Google Calendar */
    .gcal-create-btn {
      width: fit-content;
      height: 52px;
      padding: 0 22px 0 16px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      background: #2b2d30;
      color: var(--gcal-text);
      font-size: 0.92rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.45);
      transition: background 0.15s, box-shadow 0.15s;
    }
    .gcal-create-btn:hover {
      background: #35383c;
      box-shadow: 0 5px 14px rgba(0,0,0,0.55);
    }
    .gcal-plus-icon {
      font-size: 1.5rem;
      line-height: 1;
      font-weight: 400;
      background: linear-gradient(135deg, #4285f4, #34a853, #fbbc05, #ea4335);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Mini Calendario Mensual con número de semana */
    .mini-cal-card {
      padding: 4px 2px;
      user-select: none;
    }
    .mini-cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px 8px 6px;
    }
    .mini-cal-title {
      font-size: 0.86rem;
      font-weight: 500;
      color: var(--gcal-text);
      text-transform: capitalize;
    }
    .mini-cal-nav {
      display: flex; gap: 2px;
    }
    .mini-cal-nav button {
      width: 24px; height: 24px; border-radius: 50%; border: none;
      background: transparent; color: var(--gcal-text-muted); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; font-size: 0.85rem;
    }
    .mini-cal-nav button:hover { background: var(--gcal-surface-hover); color: var(--gcal-text); }

    .mini-cal-grid {
      display: grid;
      grid-template-columns: 24px repeat(7, 1fr);
      gap: 2px 1px;
      text-align: center;
      align-items: center;
    }
    .mini-cal-dow {
      font-size: 0.68rem;
      color: var(--gcal-text-muted);
      font-weight: 500;
      padding-bottom: 4px;
    }
    .mini-cal-wk {
      font-size: 0.66rem;
      color: var(--gcal-text-muted);
      background: rgba(255,255,255,0.04);
      border-radius: 4px;
      padding: 4px 0;
      font-weight: 500;
    }
    .mini-cal-day {
      width: 26px;
      height: 26px;
      margin: 0 auto;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--gcal-text);
      font-size: 0.72rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background 0.12s;
    }
    .mini-cal-day:hover { background: var(--gcal-surface-hover); }
    .mini-cal-day.other-month { color: #5f6368; }
    .mini-cal-day.is-holiday { color: #f28b82; font-weight: 700; }
    .mini-cal-day.is-today {
      background: var(--gcal-accent);
      color: var(--gcal-accent-text);
      font-weight: 700;
    }
    .mini-cal-day.is-selected:not(.is-today) {
      background: rgba(138, 180, 248, 0.24);
      color: var(--gcal-accent);
      font-weight: 700;
    }
    .mini-cal-day.has-aud::after {
      content: "";
      position: absolute;
      bottom: 2px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #8ab4f8;
    }
    .mini-cal-day.is-today.has-aud::after {
      background: #062e6f;
    }

    /* Sección Acciones Excel y Gestión en Sidebar */
    .sidebar-section {
      border-top: 1px solid var(--gcal-grid-line);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar-section-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--gcal-text);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }
    .sidebar-action-btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--gcal-border);
      background: var(--gcal-surface);
      color: var(--gcal-text);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      transition: background 0.15s;
    }
    .sidebar-action-btn:hover { background: var(--gcal-surface-hover); }
    .last-import-tag {
      font-size: 0.7rem;
      color: var(--gcal-text-muted);
      padding: 0 6px;
      line-height: 1.3;
    }

    /* Leyenda de Clasificación en Sidebar ("Mis calendarios / Categorías") */
    .legend-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 0 4px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.76rem;
      color: var(--gcal-text);
    }
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* =====================================================================
       4. CONTENEDOR PRINCIPAL DEL CALENDARIO (TARJETA REDONDEADA OSCURA)
    ===================================================================== */
    #calendar-container {
      flex: 1;
      background: var(--gcal-surface);
      border-radius: 22px;
      padding: 10px 14px 12px 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #26272a;
    }
    #calendar { height: 100%; }

    /* Ocultar toolbar nativa de FullCalendar (reemplazada por la barra superior Google Calendar) */
    .fc .fc-toolbar { display: none !important; }

    /* Tema oscuro Google Calendar para FullCalendar */
    .fc {
      --fc-border-color: var(--gcal-grid-line);
      --fc-page-bg-color: var(--gcal-surface);
      --fc-neutral-bg-color: #252629;
      --fc-today-bg-color: rgba(138, 180, 248, 0.06);
      color: var(--gcal-text);
    }

    .fc-theme-standard td,
    .fc-theme-standard th,
    .fc-theme-standard .fc-scrollgrid {
      border-color: var(--gcal-grid-line) !important;
    }

    /* Encabezados de días estilo Google Calendar (DIA arriba, número grande abajo) */
    .fc-col-header-cell {
      padding: 6px 0 8px 0 !important;
      background: var(--gcal-surface);
    }
    .gcal-col-hdr {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .gcal-col-dow {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--gcal-text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .gcal-col-num {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      font-weight: 400;
      color
