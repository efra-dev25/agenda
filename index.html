<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda de Audiencias - JG Illapel</title>

  <!-- FullCalendar v6 -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales/es.global.min.js"></script>

  <!-- SheetJS para lectura de Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Firebase Compat SDK v10 -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary: #0f172a;
      --accent: #1d4ed8;
      --bg: #f8fafc;
      --border: #cbd5e1;
      --text: #1e293b;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); }

    /* Pantalla Login */
    #login-screen {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; background: var(--primary);
    }
    .login-box {
      background: #fff; padding: 2rem; border-radius: 10px;
      width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .login-box h2 { margin-top: 0; color: var(--primary); font-size: 1.3rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 0.55rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem;
    }
    .btn {
      padding: 0.55rem 0.9rem; border: none; border-radius: 6px; cursor: pointer;
      font-weight: 600; font-size: 0.85rem; transition: opacity 0.2s; display: inline-flex; align-items: center; gap: 0.3rem;
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-dark { background: var(--primary); color: #fff; }
    .btn-success { background: #15803d; color: #fff; }
    .btn-warning { background: #b45309; color: #fff; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-outline { background: #fff; border: 1px solid var(--border); color: var(--text); }

    /* App Principal */
    #app-screen { display: none; flex-direction: column; height: 100vh; }
    header {
      background: var(--primary); color: #fff; padding: 0.65rem 1.2rem;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;
    }
    header h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }
    .toolbar {
      display: flex; gap: 0.45rem; align-items: center; flex-wrap: wrap;
    }
    .user-badge {
      font-size: 0.78rem; background: rgba(255,255,255,0.15); padding: 0.3rem 0.6rem; border-radius: 4px;
    }
    #calendar-container {
      flex: 1; padding: 0.8rem; overflow: hidden; background: #fff;
    }
    #calendar { height: 100%; }

    /* Estilos de Bloques en FullCalendar (estilo Google Calendar) */
    .fc-timegrid-slot { height: 26px !important; }
    .fc-event {
      border-radius: 4px !important; padding: 2px 4px !important;
      font-size: 0.78rem !important; line-height: 1.2 !important;
      border-left: 4px solid rgba(0,0,0,0.35) !important;
      cursor: pointer;
    }
    .fc-event-title { font-weight: 600; }

    /* Modales */
    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.6);
      align-items: center; justify-content: center; z-index: 9999; padding: 1rem;
    }
    .modal {
      background: #fff; border-radius: 8px; width: 95%; max-width: 500px;
      padding: 1.4rem; box-shadow: 0 15px 30px rgba(0,0,0,0.25); max-height: 90vh; overflow-y: auto;
    }
    .modal.modal-lg { max-width: 780px; }
    .modal h3 { margin-top: 0; color: var(--primary); border-bottom: 1px solid #e2e8f0; padding-bottom: 0.5rem; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.2rem; flex-wrap: wrap; }
    .meta-info { font-size: 0.75rem; color: #64748b; margin-top: 0.5rem; }
    #login-error { color: #dc2626; font-size: 0.82rem; margin-top: 0.6rem; display: none; }

    /* Estilos Conciliación */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.6rem; margin-bottom: 1rem; }
    .kpi-card { border: 1px solid #e2e8f0; border-radius: 6px; padding: 0.65rem; background: #f8fafc; }
    .kpi-card .num { font-size: 1.35rem; font-weight: 700; color: var(--primary); }
    .kpi-card .lbl { font-size: 0.75rem; color: #475569; }
    .diff-section { margin-top: 0.9rem; }
    .diff-section h4 { margin: 0 0 0.4rem 0; font-size: 0.92rem; color: var(--primary); }
    .diff-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-bottom: 0.8rem; }
    .diff-table th, .diff-table td { border: 1px solid #cbd5e1; padding: 0.4rem 0.5rem; text-align: left; }
    .diff-table th { background: #f1f5f9; font-weight: 600; }
    .badge-new { background: #dcfce7; color: #166534; padding: 2px 6px; border-radius: 4px; font-weight: 600; font-size: 0.72rem; }
    .badge-mod { background: #fef3c7; color: #92400e; padding: 2px 6px; border-radius: 4px; font-weight: 600; font-size: 0.72rem; }
    .badge-del { background: #fee2e2; color: #991b1b; padding: 2px 6px; border-radius: 4px; font-weight: 600; font-size: 0.72rem; }
  </style>
</head>
<body>

  <!-- 1. PANTALLA DE INICIO DE SESIÓN -->
  <div id="login-screen">
    <div class="login-box">
      <h2>Agenda de Audiencias - JG Illapel</h2>
      <p style="font-size:0.83rem; color:#475569; margin-bottom:1.2rem;">
        Ingrese con su cuenta institucional autorizada.
      </p>
      <form id="login-form">
        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" id="login-email" required placeholder="funcionario@pjud.cl" />
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="login-password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Ingresar</button>
        <div id="login-error"></div>
      </form>
    </div>
  </div>

  <!-- 2. APLICACIÓN PRINCIPAL -->
  <div id="app-screen">
    <header>
      <h1>Agenda de Audiencias - JG Illapel (15 min)</h1>
      <div class="toolbar">
        <button class="btn btn-primary" onclick="abrirModalNuevo()">+ Nueva Audiencia</button>
        <label class="btn btn-success" style="margin:0;" title="Agrega audiencias nuevas desde Excel sin borrar las existentes">
          Importar Excel (Agregar)
          <input type="file" id="excel-input-append" accept=".xlsx,.xls" style="display:none;" />
        </label>
        <label class="btn btn-warning" style="margin:0;" title="Compara con el sistema, muestra diferencias y repuebla los días incluidos en el Excel">
          Repoblar / Conciliar Excel
          <input type="file" id="excel-input-repopulate" accept=".xlsx,.xls" style="display:none;" />
        </label>
        <button class="btn btn-outline" onclick="descargarPlantillaExcel()">Plantilla Excel</button>
        <span class="user-badge" id="user-display"></span>
        <button class="btn btn-danger" onclick="cerrarSesion()">Salir</button>
      </div>
    </header>

    <div id="calendar-container">
      <div id="calendar"></div>
    </div>
  </div>

  <!-- 3. MODAL CREAR / EDITAR AUDIENCIA -->
  <div class="modal-backdrop" id="event-modal">
    <div class="modal">
      <h3 id="modal-title">Registrar Audiencia</h3>
      <input type="hidden" id="ev-id" />

      <div class="row-2">
        <div class="form-group">
          <label>RIT / Año *</label>
          <input type="text" id="ev-rit" placeholder="Ej: 1245-2026" required />
        </div>
        <div class="form-group">
          <label>Día *</label>
          <input type="date" id="ev-fecha" required />
        </div>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Hora Inicio *</label>
          <input type="time" id="ev-inicio" step="900" required />
        </div>
        <div class="form-group">
          <label>Hora Término *</label>
          <input type="time" id="ev-fin" step="900" required />
        </div>
      </div>

      <div class="form-group">
        <label>Tipo de Audiencia *</label>
        <input type="text" id="ev-tipo" list="tipos-sugeridos" placeholder="Ej: Control de Detención, Formalización..." required />
        <datalist id="tipos-sugeridos">
          <option value="Control de Detención">
          <option value="Formalización de la Investigación">
          <option value="Preparación de Juicio Oral">
          <option value="Juicio Oral Simplificado">
          <option value="Procedimiento Abreviado">
          <option value="Suspensión Condicional del Procedimiento">
          <option value="Cautela de Garantías">
          <option value="Revisión de Medidas Cautelares">
          <option value="Sobreseimiento Definitivo">
        </datalist>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Sala / Observación</label>
          <input type="text" id="ev-sala" placeholder="Ej: PRIMERA SALA / Imp..." />
        </div>
        <div class="form-group">
          <label>Color identificador</label>
          <select id="ev-color">
            <option value="#1d4ed8">Azul (Estándar)</option>
            <option value="#dc2626">Rojo (Urgente / Detenido)</option>
            <option value="#15803d">Verde (Salida Alternativa / Abreviado)</option>
            <option value="#b45309">Ámbar (Juicio / Preparación)</option>
            <option value="#6d28d9">Púrpura (Cautela / Revisión)</option>
          </select>
        </div>
      </div>

      <div class="meta-info" id="ev-audit"></div>

      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="btn-delete" style="display:none; margin-right:auto;" onclick="eliminarAudiencia()">Eliminar</button>
        <button type="button" class="btn btn-outline" onclick="cerrarModal()">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="guardarAudiencia()">Guardar</button>
      </div>
    </div>
  </div>

  <!-- 4. MODAL DE CONCILIACIÓN Y REPOBLACIÓN -->
  <div class="modal-backdrop" id="reconcile-modal">
    <div class="modal modal-lg">
      <h3>Conciliación de Agenda (Excel vs. Sistema)</h3>
      <div id="reconcile-body"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" onclick="cerrarModalConciliacion()">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btn-confirm-sync" onclick="ejecutarRepoblacion('merge')">
          Sincronizar (Agregar Nuevas + Actualizar Cambios)
        </button>
        <button type="button" class="btn btn-warning" id="btn-confirm-replace" onclick="ejecutarRepoblacion('replace')">
          Repoblar Todo el Período del Excel (Reemplazar)
        </button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. CONFIGURACIÓN DE FIREBASE (Proyecto: agenda-jg-illapel)
    // =========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDwQXdaMIM28DPtZf5zvo3d7naO214zS1M",
      authDomain: "agenda-jg-illapel.firebaseapp.com",
      databaseURL: "https://agenda-jg-illapel-default-rtdb.firebaseio.com",
      projectId: "agenda-jg-illapel",
      storageBucket: "agenda-jg-illapel.firebasestorage.app",
      messagingSenderId: "7808348863",
      appId: "1:7808348863:web:4fcd08b21f746e3ace8c0a",
      measurementId: "G-FPE9GYYLDN"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    const agendaRef = db.ref('agenda_audiencias');

    let calendar;
    let currentUser = null;
    let eventosCache = {};
    let planConciliacionPendiente = null;

    // =========================================================================
    // 2. AUTENTICACIÓN Y CONTROL DE PRIVILEGIOS
    // =========================================================================
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value;
      const errDiv = document.getElementById('login-error');
      errDiv.style.display = 'none';

      try {
        await auth.signInWithEmailAndPassword(email, pass);
      } catch (err) {
        errDiv.textContent = "Acceso denegado: Verifique correo y contraseña autorizados.";
        errDiv.style.display = 'block';
      }
    });

    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'flex';
        document.getElementById('user-display').textContent = user.email;
        inicializarCalendario();
        escucharBaseDatos();
      } else {
        currentUser = null;
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('app-screen').style.display = 'none';
      }
    });

    function cerrarSesion() {
      auth.signOut();
    }

    // =========================================================================
    // 3. INICIALIZACIÓN DE FULLCALENDAR (ESTILO GOOGLE CALENDAR 15 MIN)
    // =========================================================================
    function inicializarCalendario() {
      if (calendar) return;
      const calendarEl = document.getElementById('calendar');

      calendar = new FullCalendar.Calendar(calendarEl, {
        locale: 'es',
        initialView: 'timeGridWeek',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'timeGridDay,timeGridWeek,dayGridMonth'
        },
        buttonText: {
          today: 'Hoy',
          month: 'Mes',
          week: 'Semana',
          day: 'Día'
        },
        slotDuration: '00:15:00',
        slotLabelInterval: '00:30:00',
        slotLabelFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
        eventTimeFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
        slotMinTime: '08:00:00',
        slotMaxTime: '18:00:00',
        allDaySlot: false,
        nowIndicator: true,
        slotEventOverlap: false,
        selectable: true,
        editable: true,

        select: function(info) {
          const fecha = info.startStr.slice(0, 10);
          const inicio = info.startStr.slice(11, 16);
          const fin = info.endStr.slice(11, 16);
          abrirModalNuevo(fecha, inicio, fin);
        },

        eventClick: function(info) {
          abrirModalEditar(info.event.id);
        },

        eventDrop: function(info) {
          actualizarHorarioDesdeDrag(info.event);
        },

        eventResize: function(info) {
          actualizarHorarioDesdeDrag(info.event);
        }
      });

      calendar.render();
    }

    // =========================================================================
    // 4. SINCRONIZACIÓN EN TIEMPO REAL CON FIREBASE
    // =========================================================================
    function escucharBaseDatos() {
      agendaRef.on('value', (snapshot) => {
        eventosCache = snapshot.val() || {};
        if (!calendar) return;

        calendar.removeAllEvents();
        Object.entries(eventosCache).forEach(([id, item]) => {
          calendar.addEvent({
            id: id,
            title: `${item.rit} | ${item.tipo}${item.sala ? ' (' + item.sala + ')' : ''}`,
            start: `${item.fecha}T${item.inicio}:00`,
            end: `${item.fecha}T${item.fin}:00`,
            backgroundColor: item.color || '#1d4ed8',
            borderColor: item.color || '#1d4ed8'
          });
        });
      });
    }

    function actualizarHorarioDesdeDrag(fcEvent) {
      const id = fcEvent.id;
      const actual = eventosCache[id];
      if (!actual) return;

      const pad = (n) => String(n).padStart(2, '0');
      const s = fcEvent.start;
      const e = fcEvent.end || new Date(s.getTime() + 15 * 60000);

      const nuevaFecha = `${s.getFullYear()}-${pad(s.getMonth()+1)}-${pad(s.getDate())}`;
      const nuevoInicio = `${pad(s.getHours())}:${pad(s.getMinutes())}`;
      const nuevoFin = `${pad(e.getHours())}:${pad(e.getMinutes())}`;

      agendaRef.child(id).update({
        fecha: nuevaFecha,
        inicio: nuevoInicio,
        fin: nuevoFin,
        modificadoPor: currentUser.email,
        modificadoEn: new Date().toISOString()
      });
    }

    // =========================================================================
    // 5. CRUD MODAL (CREAR, EDITAR, ELIMINAR)
    // =========================================================================
    function abrirModalNuevo(fecha = '', inicio = '09:00', fin = '09:15') {
      document.getElementById('modal-title').textContent = 'Registrar Nueva Audiencia';
      document.getElementById('ev-id').value = '';
      document.getElementById('ev-rit').value = '';
      document.getElementById('ev-fecha').value = fecha || new Date().toISOString().slice(0, 10);
      document.getElementById('ev-inicio').value = inicio;
      document.getElementById('ev-fin').value = fin;
      document.getElementById('ev-tipo').value = '';
      document.getElementById('ev-sala').value = '';
      document.getElementById('ev-color').value = '#1d4ed8';
      document.getElementById('ev-audit').textContent = '';
      document.getElementById('btn-delete').style.display = 'none';
      document.getElementById('event-modal').style.display = 'flex';
    }

    function abrirModalEditar(id) {
      const item = eventosCache[id];
      if (!item) return;

      document.getElementById('modal-title').textContent = 'Editar Audiencia';
      document.getElementById('ev-id').value = id;
      document.getElementById('ev-rit').value = item.rit || '';
      document.getElementById('ev-fecha').value = item.fecha || '';
      document.getElementById('ev-inicio').value = item.inicio || '';
      document.getElementById('ev-fin').value = item.fin || '';
      document.getElementById('ev-tipo').value = item.tipo || '';
      document.getElementById('ev-sala').value = item.sala || '';
      document.getElementById('ev-color').value = item.color || '#1d4ed8';

      const infoAudit = item.modificadoPor
        ? `Última edición: ${item.modificadoPor} (${new Date(item.modificadoEn).toLocaleString('es-CL')})`
        : `Registrado por: ${item.creadoPor || 'N/D'}`;
      document.getElementById('ev-audit').textContent = infoAudit;

      document.getElementById('btn-delete').style.display = 'inline-block';
      document.getElementById('event-modal').style.display = 'flex';
    }

    function cerrarModal() {
      document.getElementById('event-modal').style.display = 'none';
    }

    function guardarAudiencia() {
      const id = document.getElementById('ev-id').value;
      const rit = document.getElementById('ev-rit').value.trim();
      const fecha = document.getElementById('ev-fecha').value;
      const inicio = document.getElementById('ev-inicio').value;
      const fin = document.getElementById('ev-fin').value;
      const tipo = document.getElementById('ev-tipo').value.trim();
      const sala = document.getElementById('ev-sala').value.trim();
      const color = document.getElementById('ev-color').value;

      if (!rit || !fecha || !inicio || !fin || !tipo) {
        alert("Complete los campos obligatorios: RIT/Año, Día, Hora inicio, Hora término y Tipo de audiencia.");
        return;
      }
      if (fin <= inicio) {
        alert("La hora de término debe ser posterior a la hora de inicio.");
        return;
      }

      const payload = {
        rit, fecha, inicio, fin, tipo, sala, color,
        modificadoPor: currentUser.email,
        modificadoEn: new Date().toISOString()
      };

      if (id) {
        agendaRef.child(id).update(payload);
      } else {
        payload.creadoPor = currentUser.email;
        payload.creadoEn = new Date().toISOString();
        agendaRef.push(payload);
      }
      cerrarModal();
    }

    function eliminarAudiencia() {
      const id = document.getElementById('ev-id').value;
      if (id && confirm("¿Eliminar esta audiencia de la agenda?")) {
        agendaRef.child(id).remove();
        cerrarModal();
      }
    }

    // =========================================================================
    // 6. PARSEO DE EXCEL UNIJUD (FILA 8 ENCABEZADOS, COL M ESTADO = PROGRAMADA)
    // =========================================================================
    function descargarPlantillaExcel() {
      const datos = [
        { "RIT/Año": "1245-2026", "Día": "26-11-2026", "Hora inicio": "09:00", "Hora término": "09:30", "Tipo audiencia": "Control de Detención", "Sala": "PRIMERA SALA" },
        { "RIT/Año": "890-2026",  "Día": "26-11-2026", "Hora inicio": "09:00", "Hora término": "09:45", "Tipo audiencia": "Preparación Juicio Oral", "Sala": "PRIMERA SALA" },
        { "RIT/Año": "1102-2026", "Día": "26-11-2026", "Hora inicio": "09:15", "Hora término": "09:30", "Tipo audiencia": "Cautela de Garantías", "Sala": "PRIMERA SALA" }
      ];
      const ws = XLSX.utils.json_to_sheet(datos);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Audiencias");
      XLSX.writeFile(wb, "Plantilla_Carga_Agenda.xlsx");
    }

    function normTxt(str) {
      return String(str ?? "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "");
    }

    function normalizarFechaExcel(val) {
      if (val === undefined || val === null || val === "") return null;
      if (typeof val === 'number') {
        const d = XLSX.SSF.parse_date_code(val);
        if (!d) return null;
        return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
      }
      const str = String(val).trim();
      const m1 = str.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
      if (m1) return `${m1[3]}-${m1[2].padStart(2,'0')}-${m1[1].padStart(2,'0')}`;
      const m2 = str.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
      if (m2) return `${m2[1]}-${m2[2].padStart(2,'0')}-${m2[3].padStart(2,'0')}`;
      return null;
    }

    function normalizarHoraExcel(val) {
      if (val === undefined || val === null || val === '') return null;
      if (typeof val === 'number') {
        const totalMin = Math.round(val * 24 * 60);
        const h = Math.floor(totalMin / 60) % 24;
        const m = totalMin % 60;
        return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      }
      const m = String(val).trim().match(/^(\d{1,2}):(\d{2})/);
      if (m) return `${m[1].padStart(2,'0')}:${m[2]}`;
      return null;
    }

    function sumar15Min(hhmm) {
      const [h, m] = hhmm.split(':').map(Number);
      const total = h * 60 + m + 15;
      return `${String(Math.floor(total / 60) % 24).padStart(2,'0')}:${String(total % 60).padStart(2,'0')}`;
    }

    function inferirColorAudiencia(tipo) {
      const t = normTxt(tipo);
      if (t.includes("detencion") || t.includes("cautelar")) return "#dc2626";
      if (t.includes("sobreseimiento") || t.includes("abreviado") || t.includes("suspension") || t.includes("no perseverar")) return "#15803d";
      if (t.includes("juicio") || t.includes("preparacion")) return "#b45309";
      if (t.includes("21.675") || t.includes("supervision") || t.includes("cautela")) return "#6d28d9";
      return "#1d4ed8";
    }

    function parsearPlanillaUnijud(matriz) {
      // Buscar fila de encabezados (Fila 8 = índice 7 en Unijud, o Fila 1 = índice 0 en plantilla manual)
      let headerRowIdx = -1;
      for (let r = 0; r < Math.min(25, matriz.length); r++) {
        const fila = (matriz[r] || []).map(normTxt);
        const tieneRit = fila.some(c => c === "rit" || c === "rit/ano" || c === "rit-ano");
        const tieneFecha = fila.some(c => c === "fecha_audiencia" || c === "dia" || c === "fecha");
        const tieneHora = fila.some(c => c === "horario" || c === "hora inicio" || c === "inicio");
        if (tieneRit && (tieneFecha || tieneHora)) {
          headerRowIdx = r;
          break;
        }
      }

      if (headerRowIdx === -1) {
        return { error: "No se encontró la fila de encabezados (HORARIO, RIT, AÑO, AUDIENCIA, FECHA_AUDIENCIA, ESTADO)." };
      }

      const headersNorm = matriz[headerRowIdx].map(normTxt);
      const colOf = (exactos, parciales = []) => {
        let i = headersNorm.findIndex(h => exactos.includes(h));
        if (i === -1 && parciales.length) {
          i = headersNorm.findIndex(h => parciales.some(p => h.includes(p)));
        }
        return i;
      };

      const colHorario = colOf(["horario", "hora inicio", "inicio"], ["horario", "hora inicio"]);
      const colTermino = colOf(["hora termino", "termino", "fin"], ["termino"]);
      const colRit     = colOf(["rit", "rit/ano", "rit-ano"], ["rit"]);
      const colAnio    = colOf(["ano", "anio"]);
      const colFecha   = colOf(["fecha_audiencia", "dia", "fecha"], ["fecha_audiencia", "fecha"]);
      const colAud     = colOf(["audiencia", "tipo audiencia", "tipo_audiencia"], ["audiencia"]);
      const colEstado  = colOf(["estado"]); // Columna M (índice 12) en Unijud
      const colTipoInt = colOf(["tipo"]);
      const colNomInt  = colOf(["nombre_interviniente", "interviniente"]);
      const colSala    = colOf(["sala"], ["sala"]);
      const colJuez    = colOf(["juez"]);

      if (colRit === -1 || colFecha === -1 || colHorario === -1 || colAud === -1) {
        return { error: "Faltan columnas obligatorias en el encabezado (HORARIO, RIT, FECHA_AUDIENCIA o AUDIENCIA)." };
      }

      const audienciasMap = new Map();
      const fechasDetectadas = new Set();
      let totalFilasDatos = 0;
      let filasNoProgramadas = 0;
      let filasInvalidas = 0;

      // Leer estrictamente desde la fila siguiente al encabezado (Fila 9 en adelante en Unijud)
      for (let r = headerRowIdx + 1; r < matriz.length; r++) {
        const row = matriz[r];
        if (!row || row.every(v => v === "" || v === null || v === undefined)) continue;
        totalFilasDatos++;

        // Filtrar estrictamente ESTADO === "Programada" (Columna M en Unijud)
        if (colEstado !== -1) {
          const estadoVal = normTxt(row[colEstado]);
          if (estadoVal !== "programada") {
            filasNoProgramadas++;
            continue;
          }
        }

        let ritRaw = String(row[colRit] ?? "").trim().replace(/\.0$/, "");
        if (colAnio !== -1 && row[colAnio] !== "" && row[colAnio] !== null && !ritRaw.includes("-")) {
          const anioRaw = String(row[colAnio]).trim().replace(/\.0$/, "");
          if (anioRaw) ritRaw = `${ritRaw}-${anioRaw}`;
        }

        const fecha = normalizarFechaExcel(row[colFecha]);
        const inicio = normalizarHoraExcel(row[colHorario]);
        let fin = colTermino !== -1 ? normalizarHoraExcel(row[colTermino]) : null;
        const tipo = String(row[colAud] ?? "").trim();

        if (!ritRaw || !fecha || !inicio || !tipo) {
          filasInvalidas++;
          continue;
        }
        if (!fin || fin <= inicio) fin = sumar15Min(inicio);

        fechasDetectadas.add(fecha);
        const salaVal = colSala !== -1 ? String(row[colSala] ?? "").trim() : "";
        const juezVal = colJuez !== -1 ? String(row[colJuez] ?? "").trim() : "";
        const tipoInt = colTipoInt !== -1 ? normTxt(row[colTipoInt]) : "";
        const nomInt  = colNomInt !== -1 ? String(row[colNomInt] ?? "").trim() : "";

        // Clave única de audiencia (agrupa múltiples intervinientes de la misma audiencia)
        const clave = `${ritRaw}|${fecha}|${inicio}`;
        if (!audienciasMap.has(clave)) {
          audienciasMap.set(clave, {
            clave,
            rit: ritRaw,
            fecha,
            inicio,
            fin,
            tipo,
            salaBase: salaVal,
            juezBase: juezVal,
            denunciados: new Set()
          });
        }

        const reg = audienciasMap.get(clave);
        if (nomInt && (tipoInt.includes("denunciado") || tipoInt.includes("imputado") || tipoInt.includes("requerido"))) {
          reg.denunciados.add(nomInt);
        }
      }

      // Consolidar descripción de sala/imputados para cada audiencia única
      const listaFinal = [];
      audienciasMap.forEach((aud) => {
        const detalles = [];
        if (aud.salaBase) detalles.push(aud.salaBase);
        if (aud.juezBase) detalles.push(`Juez: ${aud.juezBase}`);
        if (aud.denunciados.size > 0) detalles.push(`Imp: ${Array.from(aud.denunciados).join(", ")}`);
        listaFinal.push({
          clave: aud.clave,
          rit: aud.rit,
          fecha: aud.fecha,
          inicio: aud.inicio,
          fin: aud.fin,
          tipo: aud.tipo,
          sala: detalles.join(" | "),
          color: inferirColorAudiencia(aud.tipo)
        });
      });

      return {
        headerRowNum: headerRowIdx + 1,
        totalFilasDatos,
        filasNoProgramadas,
        filasInvalidas,
        fechasDetectadas: Array.from(fechasDetectadas).sort(),
        audiencias: listaFinal
      };
    }

    function leerArchivoExcel(file, callback) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const matriz = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        const resultado = parsearPlanillaUnijud(matriz);
        callback(resultado);
      };
      reader.readAsArrayBuffer(file);
    }

    // =========================================================================
    // 7. FLUJO A: IMPORTAR EXCEL (AGREGAR SOLO NUEVAS SIN BORRAR)
    // =========================================================================
    document.getElementById('excel-input-append').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      leerArchivoExcel(file, (res) => {
        e.target.value = '';
        if (res.error) {
          alert(res.error);
          return;
        }

        const existentes = new Set(
          Object.values(eventosCache).map(ev => `${ev.rit}|${ev.fecha}|${ev.inicio}`)
        );

        let cargadas = 0;
        let duplicadas = 0;

        res.audiencias.forEach((aud) => {
          if (existentes.has(aud.clave)) {
            duplicadas++;
            return;
          }
          existentes.add(aud.clave);
          agendaRef.push({
            rit: aud.rit,
            fecha: aud.fecha,
            inicio: aud.inicio,
            fin: aud.fin,
            tipo: aud.tipo,
            sala: aud.sala,
            color: aud.color,
            creadoPor: currentUser.email,
            creadoEn: new Date().toISOString()
          });
          cargadas++;
        });

        alert(
          `Importación completada (Encabezados leídos en fila ${res.headerRowNum}):
` +
          `• Audiencias Programadas nuevas cargadas: ${cargadas}
` +
          `• Audiencias ya existentes omitidas: ${duplicadas}
` +
          `• Filas omitidas por estado distinto a Programada: ${res.filasNoProgramadas}`
        );
      });
    });

    // =========================================================================
    // 8. FLUJO B: CONCILIACIÓN Y REPOBLACIÓN DE AGENDA
    // =========================================================================
    document.getElementById('excel-input-repopulate').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      leerArchivoExcel(file, (res) => {
        e.target.value = '';
        if (res.error) {
          alert(res.error);
          return;
        }
        mostrarModalConciliacion(res);
      });
    });

    function mostrarModalConciliacion(res) {
      const fechasSet = new Set(res.fechasDetectadas);
      const excelMap = new Map(res.audiencias.map(a => [a.clave, a]));

      // Filtrar registros actualmente en Firebase que corresponden a las mismas fechas del Excel
      const sistemaEnFechas = Object.entries(eventosCache)
        .filter(([id, ev]) => fechasSet.has(ev.fecha))
        .map(([id, ev]) => ({ id, clave: `${ev.rit}|${ev.fecha}|${ev.inicio}`, ...ev }));

      const sistemaMap = new Map(sistemaEnFechas.map(ev => [ev.clave, ev]));

      const nuevasEnExcel = [];
      const conDiferencias = [];
      const coincidentes = [];
      const sobrantesEnSistema = [];

      // 1. Evaluar cada audiencia del Excel frente al Sistema
      excelMap.forEach((audExcel, clave) => {
        if (!sistemaMap.has(clave)) {
          nuevasEnExcel.push(audExcel);
        } else {
          const audSis = sistemaMap.get(clave);
          const diffTipo = normTxt(audExcel.tipo) !== normTxt(audSis.tipo);
          const diffSala = normTxt(audExcel.sala) !== normTxt(audSis.sala);
          if (diffTipo || diffSala) {
            conDiferencias.push({ excel: audExcel, sistema: audSis, diffTipo, diffSala });
          } else {
            coincidentes.push({ excel: audExcel, sistema: audSis });
          }
        }
      });

      // 2. Evaluar registros en el Sistema (para esas fechas) que YA NO vienen en el Excel (ej. reprogramadas/eliminadas en Unijud)
      sistemaEnFechas.forEach((audSis) => {
        if (!excelMap.has(audSis.clave)) {
          sobrantesEnSistema.push(audSis);
        }
      });

      planConciliacionPendiente = {
        res,
        nuevasEnExcel,
        conDiferencias,
        coincidentes,
        sobrantesEnSistema,
        sistemaEnFechas
      };

      const totalNoCoincidentes = nuevasEnExcel.length + conDiferencias.length + sobrantesEnSistema.length;

      let html = `
        <p style="font-size:0.84rem; color:#334155; margin-top:0;">
          <strong>Período analizado:</strong> ${res.fechasDetectadas.join(", ") || "Sin fechas"}
          (Encabezados en fila ${res.headerRowNum} | Filas no Programadas descartadas: ${res.filasNoProgramadas})
        </p>
        <div class="kpi-grid">
          <div class="kpi-card"><div class="num">${res.audiencias.length}</div><div class="lbl">Programadas en Excel</div></div>
          <div class="kpi-card"><div class="num">${coincidentes.length}</div><div class="lbl">Coincidentes exactas</div></div>
          <div class="kpi-card"><div class="num" style="color:#15803d;">${nuevasEnExcel.length}</div><div class="lbl">Nuevas en Excel</div></div>
          <div class="kpi-card"><div class="num" style="color:#b45309;">${conDiferencias.length}</div><div class="lbl">Con cambios (Tipo/Sala)</div></div>
          <div class="kpi-card"><div class="num" style="color:#dc2626;">${sobrantesEnSistema.length}</div><div class="lbl">En Sistema pero no en Excel</div></div>
        </div>
      `;

      if (totalNoCoincidentes === 0) {
        html += `<p style="background:#dcfce7; color:#166534; padding:0.75rem; border-radius:6px; font-weight:600;">
          ✔ Conciliación perfecta: Todos los registros del Excel coinciden exactamente con lo ya poblado en el sistema.
        </p>`;
      } else {
        html += `<p style="font-size:0.83rem; font-weight:600; color:#991b1b;">
          Se detectaron ${totalNoCoincidentes} registros NO coincidentes entre el Excel y el sistema:
        </p>`;

        if (nuevasEnExcel.length > 0) {
          html += `<div class="diff-section">
            <h4>1. En Excel pero NO en Sistema (${nuevasEnExcel.length}) <span class="badge-new">NUEVAS</span></h4>
            <table class="diff-table">
              <thead><tr><th>Fecha</th><th>Hora</th><th>RIT/Año</th><th>Audiencia</th><th>Detalle / Sala</th></tr></thead>
              <tbody>
                ${nuevasEnExcel.map(a => `<tr><td>${a.fecha}</td><td>${a.inicio}</td><td>${a.rit}</td><td>${a.tipo}</td><td>${a.sala || '-'}</td></tr>`).join('')}
              </tbody>
            </table>
          </div>`;
        }

        if (conDiferencias.length > 0) {
          html += `<div class="diff-section">
            <h4>2. Mismo RIT/Fecha/Hora pero con diferencias (${conDiferencias.length}) <span class="badge-mod">DIFERENTE</span></h4>
            <table class="diff-table">
              <thead><tr><th>Fecha / Hora</th><th>RIT/Año</th><th>En Sistema</th><th>En Excel</th></tr></thead>
              <tbody>
                ${conDiferencias.map(d => `
                  <tr>
                    <td>${d.excel.fecha} ${d.excel.inicio}</td>
                    <td>${d.excel.rit}</td>
                    <td>${d.sistema.tipo}<br><small style="color:#64748b;">${d.sistema.sala || '-'}</small></td>
                    <td>${d.excel.tipo}<br><small style="color:#64748b;">${d.excel.sala || '-'}</small></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>`;
        }

        if (sobrantesEnSistema.length > 0) {
          html += `<div class="diff-section">
            <h4>3. En Sistema pero NO en Excel Programada (${sobrantesEnSistema.length}) <span class="badge-del">NO COINCIDENTE / REPROGRAMADA</span></h4>
            <table class="diff-table">
              <thead><tr><th>Fecha</th><th>Hora</th><th>RIT/Año</th><th>Audiencia en Sistema</th><th>Detalle / Sala</th></tr></thead>
              <tbody>
                ${sobrantesEnSistema.map(s => `<tr><td>${s.fecha}</td><td>${s.inicio}</td><td>${s.rit}</td><td>${s.tipo}</td><td>${s.sala || '-'}</td></tr>`).join('')}
              </tbody>
            </table>
          </div>`;
        }
      }

      document.getElementById('reconcile-body').innerHTML = html;
      document.getElementById('reconcile-modal').style.display = 'flex';
    }

    function cerrarModalConciliacion() {
      document.getElementById('reconcile-modal').style.display = 'none';
      planConciliacionPendiente = null;
    }

    function ejecutarRepoblacion(modo) {
      if (!planConciliacionPendiente) return;
      const { res, nuevasEnExcel, conDiferencias, sistemaEnFechas } = planConciliacionPendiente;

      if (modo === 'replace') {
        const msgConfirm =
          `¿Confirma REPOBLAR todo el período (${res.fechasDetectadas.join(", ")})?

` +
          `Se eliminarán los ${sistemaEnFechas.length} registros actuales de esas fechas y se cargarán las ${res.audiencias.length} audiencias Programadas del Excel.`;
        if (!confirm(msgConfirm)) return;

        // 1. Eliminar registros existentes de las fechas del Excel
        sistemaEnFechas.forEach(ev => {
          agendaRef.child(ev.id).remove();
        });

        // 2. Poblar todas las audiencias Programadas del Excel
        res.audiencias.forEach(aud => {
          agendaRef.push({
            rit: aud.rit,
            fecha: aud.fecha,
            inicio: aud.inicio,
            fin: aud.fin,
            tipo: aud.tipo,
            sala: aud.sala,
            color: aud.color,
            creadoPor: currentUser.email,
            creadoEn: new Date().toISOString()
          });
        });

        cerrarModalConciliacion();
        alert(`Repoblación completada: ${res.audiencias.length} audiencias Programadas cargadas para el período.`);
      } else {
        // Modo 'merge': agrega las nuevas y actualiza las que tenían diferencias sin borrar agendas manuales
        nuevasEnExcel.forEach(aud => {
          agendaRef.push({
            rit: aud.rit,
            fecha: aud.fecha,
            inicio: aud.inicio,
            fin: aud.fin,
            tipo: aud.tipo,
            sala: aud.sala,
            color: aud.color,
            creadoPor: currentUser.email,
            creadoEn: new Date().toISOString()
          });
        });

        conDiferencias.forEach(d => {
          agendaRef.child(d.sistema.id).update({
            tipo: d.excel.tipo,
            sala: d.excel.sala,
            color: d.excel.color,
            modificadoPor: currentUser.email,
            modificadoEn: new Date().toISOString()
          });
        });

        cerrarModalConciliacion();
        alert(`Sincronización completada: ${nuevasEnExcel.length} nuevas agregadas y ${conDiferencias.length} actualizadas.`);
      }
    }
  </script>
